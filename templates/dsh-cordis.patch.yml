# DeepSeek Harness (dsh): local llama.cpp router as a provider route.
# Copy to ~/.dsh/cordis.patch.yml (home layer: applies to every profile).
# Generated from models-preset.ini; the ids are the router's preset names.
# Thinking: the router defaults to off; reasoning_effort turns it on per request
# (local llama.cpp patch): low 2K, medium 8K, high unlimited, none = off.
- id: llm-pi-ai
  config:
    providers:
      cachypc:
        displayName: CachyPC router
        api: openai-completions
        baseURL: http://cachypc.local:8090/v1
        headers:
          Authorization: Bearer none   # keyless server; pi-ai still wants a key
        timeoutMs: 900000
        streamIdleTimeoutMs: 900000
        compat:
          thinkingFormat: openai
          supportsReasoningEffort: true
        models:
          - id: qwen3.8-27B-q6-32k
            contextWindow: 32768
            maxTokens: 16384
            reasoningEfforts:
              'off': none
              low: low
              medium: medium
              high: high
          - id: qwen3.8-27B-q6-128k
