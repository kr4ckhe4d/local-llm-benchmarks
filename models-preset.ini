ctx-size     = 32768
ubatch-size  = 1024
batch-size   = 2048
flash-attn   = on
cache-type-k = q8_0
cache-type-v = q8_0
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
presence-penalty = 1.5
reasoning-budget = 4096

