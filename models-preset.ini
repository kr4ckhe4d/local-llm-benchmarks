; ------------------------------------------- Qwen3.5-27B-Uncensored (HauhauCS)
; DENSE 27B, arch qwen35 — architecturally the same model as Qwen3.8-27B above,
; one base version back, so the same rules apply: no n-cpu-moe, and native
; 262144 is not reachable on this card.
;
; It runs 266 MiB heavier than Qwen3.8 at 64k, which is enough to remove the
; q8_0-at-64k option that preset relies on: q8_0 there leaves 55 MiB, inside
; the range the desktop's own VRAM moves during a session. So 64k takes q4_0
; and its ~23% generation penalty at depth. At 32k the gap is only 67 MiB and
; q8_0 is comfortable — prefer 32k on this model.
;
; 128k is deliberately absent. It loads at 32 MiB free, which is less than the
; measured desktop baseline drift (395-701 MiB in one session). See README.
;
; Thinking model with enable_thinking and no reasoning_effort, same as Qwen3.8,
; so reasoning-budget applies for the same reason.
;
; 2026-10-05 (R9700): the constraints above were all the 16 GB card. 64k now
; runs q8_0 KV and -ub 1024 like 32k, with 10,059 MiB free on the 9070 XT.
; Shallow generation is unchanged (32.07 -> 32.36 tok/s, 700-token probe,
; n=3); what q8_0 buys is the depth penalty q4_0 carried. No MTP: this file
; has no blk.64 head.

