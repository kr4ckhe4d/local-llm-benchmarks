; template but the server does not honour that on its own: pass
; enable_thinking:false or it burns the whole budget on reasoning. 262144 is
; already a YaRN 32x stretch from an 8192 base.

[laguna-33B-A3B-32k]
alias = laguna-32k
model        = /home/nipuna/llama.cpp/models/Laguna-XS-2.1-Q4_K_M.gguf
ctx-size     = 32768
n-cpu-moe    = 16
ubatch-size  = 1024
batch-size   = 2048
flash-attn   = on
cache-type-k = q8_0
cache-type-v = q8_0
chat-template-kwargs = {"enable_thinking":false}

[laguna-33B-A3B-128k]
