;  ---------------------------------------------- Gemma 4-26B-A4B  VISION
; Gemma 4 is multimodal and llama.cpp b10463 has the graph built in
; (PROJECTOR_TYPE_GEMMA4V in clip.cpp; libmtmd + llama-mtmd-cli are compiled).
; mmproj-F16.gguf is 1.19GB, clip.vision.projector_type = gemma4v, 224px.
; Vision only -- the audio projectors (gemma4a/gemma4ua) exist in llama.cpp but
; are not in this file and are not downloaded.
;
; The projector costs ~1.9GB of VRAM, more than the 1.19GB file, so -ncmoe has
; to rise: at the text preset's -ncmoe 8 the 32k fit leaves 39 MiB, which is
; not shippable. These presets carry the MTP drafter TOO, and the two compose
; without trouble. Measured 2026-08-29, both with the drafter attached:
;
;   32k : ncmoe 10 -> 427 free | 11 -> 880 | 12 -> 1,334     (ship 11)
;   128k: ncmoe 14 -> 163 free | 15 ->  588 | 16 -> 1,043    (ship 16)
;
; Verified end to end on a probe image at BOTH contexts: read the rendered text
; PROBE-770487 exactly, named red circle / blue square / green triangle, counted
; three, and solved rendered arithmetic (7 + 35 = 42). 4/4 each time. A 640x420
; image costs only ~177 prompt tokens. Draft acceptance on the vision turn hit
; 95.9% (mean run 3.88) -- the highest measured on this box, since describing an
; image produces very predictable tokens.
;
; Kept SEPARATE from the text presets: attaching the projector there would raise
; -ncmoe for everyone and cost text-only speed for a capability most turns do
; not use.
;
; 2026-10-05 (R9700): both reasons above are history. With no offload the
; projector fits easily and costs no speed; vision runs as fast as text:
;
;   |      | as written      | no offload | gain | free     |
;   | 32k  | 83.42 (ncmoe11) | 143.60     | +72% | 7,500    |
;   | 128k | 73.82 (ncmoe16) | 143.14     | +94% | 6,732    |
;
; Still kept separate, since the projector holds ~1.9 GB for turns that do not
; use it. Merging them is now a free choice rather than a speed trade.

[gemma4-26B-A4B-vision-32k]
alias = gemma4-vision-32k
model             = /home/nipuna/llama.cpp/models/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
mmproj            = /home/nipuna/llama.cpp/models/mmproj-F16.gguf
model-draft       = /home/nipuna/llama.cpp/models/mtp-gemma-4-26B-A4B-it.gguf
spec-type         = draft-mtp
ctx-size          = 32768
reasoning-budget  = 1024
