; TRIAL: TENSOR SPLIT, added 2026-11-12. `split-mode = tensor` splits every weight
; tensor and the KV cache over both cards, so both work on every layer instead of
; taking turns (dense-moe docs/tensor_split.md; r9700+rx9070.md "-sm tensor").
; Experimental upstream. Not the default: the presets above are unchanged.
;
;   * device = ROCm0,ROCm1 is required: without it the mode takes the Ryzen's
;     integrated GPU as a third device (the RDNA fork crashes at load).
;   * --fit does not support the mode; sampling runs on the CPU.
;   * The split is about even by default, which fills the 16 GB card: UD-Q6_K at
;     128K leaves 589 MiB on the 9070 XT. tensor-split = 2,3 (9070 XT, R9700)
;     leaves 3,365 MiB at 78.3 tok/s against 87.1; 1,2 leaves 5,127 at 72.5.
;     The q6 preset below uses 2,3; q4xl leaves 3.1 GiB at the default.
;   * Throughput probe and code quality (12 seeds, thinking off), 128K:
;       |                                   | tok/s | seeds mean +- sd |
;       | q6-128k-nothink (layer, stock)    |  57.8 | 37.3 +- 4.7      |
;       | q6-128k-tensor-nothink, stock     |  86.0 | 39.2 +- 5.3      |  (even split)
;       | q4xl-128k-tensor-nothink, stock   |  92.4 | 35.8 +- 4.8      |
;       | q4xl-128k-tensor-nothink, fork    | 121.8 | 37.8 +- 4.7      |
;     At 120K of context: 28 / 32 tok/s today, 45 / 54 (q6, stock),
;     91 / 99 (q4xl, fork).
;   * The fork (stew675/llama-cpp-rdna-boosts r265, ~/llama.cpp-rdna-fork) is a
;     different binary, and the router runs every preset on its own binary:
;       ROUTER_BIN=~/llama.cpp-rdna-fork/build/bin/llama-server switch-model router nothink
;     The fork build does not carry patches/llama-per-request-thinking.patch, so
;     there a request cannot turn thinking back on.
;   * q4xl is the Unsloth Dynamic v3.1 UD-Q4_K_XL (KLD vs Q8 0.0062 against the
;     Q6_K's 0.0018; no loss shown in code quality).
