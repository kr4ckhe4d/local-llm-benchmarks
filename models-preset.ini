version = 1

; llama-server router presets — pick any of these from Open WebUI's model
; dropdown and the router loads it on demand, unloading the previous one.
;
; Section names carry the parameter count because the section name IS the label
; Open WebUI shows: llama.cpp overwrites LLAMA_ARG_ALIAS with it when spawning
; each child, so there is no separate display-name field. Format is
; <model>-<total>B[-A<active>B]-<quant>[-vision]-<ctx>; the A-suffix marks MoE
; active params. The quant (q3/q4/q6/q8/mxfp4) is in every name since
; 2026-10-07; each preset's previous name stays as an alias.
;
; Each section also keeps 'alias = <old-name>' so chats created before the
; rename still resolve. Aliases route but are not listed in /v1/models —
; verified: an unknown model 400s in ~1ms, while the old name loads normally.
;
; Values mirror the verified configs in switch-model.sh. Two caveats:
;   * Every model here runs on whichever binary the router was launched with.
;     The router is started from build/ (ROCm), so gpt-oss-20b loses the Vulkan
;     generation advantage it has at 32k (181 vs 148 tok/s). Everything else
;     prefers ROCm anyway.
;   * Launch the router with --models-max 1. Since 2026-10-05 there are two
;     cards, a 9070 XT (16,304 MiB) and an R9700 (32,624 MiB), and llama.cpp
;     splits every preset across both with no flag. 48.9 GB is still not room
;     for two residents: the MoE presets below now take 19-43 GB each.
;
; TWO CARDS, measured 2026-10-05. Both run off CPU root ports at PCIe 5.0 x8
; (x8/x8 bifurcation; each card's internal switch reports x16, which is not the
; slot). Layer split runs them in turn, so a dense model gains nothing from
; the second card beyond room: Qwen3.8-27B IQ4_XS at 32K went 30.27 -> 31.57.
; MoE gains a lot, because it no longer needs CPU expert offload at all -- see
; each MoE family below. On every preset the 9070 XT is the tight card: it gets
; ~1/3 of the layers plus the desktop. fit.sh reports it per card.

[*]
n-gpu-layers = 99
parallel     = 1
; DirectIO loading, added 2026-10-05. Since the RAM went to 32 GB, mmap pages
; any model near that size through a thrashing page cache: Laguna Q8 (35.6 GB)
; did not finish loading in 300 s. dio loaded it in 10. For a 22 GB model with
; a warm cache, mmap is quicker (1.8 s against 3.8), but dio is the same 3.8 s
; every time and never falls off the cliff, and the router rarely finds a
; warm cache when it switches models anyway.
load-mode    = dio
; Context checkpoints capped at 4 (default 32), added 2026-10-28. They live in
; system RAM, and on Qwen3.8-27B at 180k each one was 0.5-0.9 GB. A long Qwen
; Code turn filled them: the child reached 25.1 GB RSS on the 30 GB box, went
; into swap, and stopped answering mid-turn (the log's "prompt state size
; 23689 MiB exceeds cache size limit" is the same state). Measured on the
; respawn: 4.4 GB loaded, 7.6 GB after a 177k prefill, then +0.9 GB per agent
; request, 16.2 GB four requests later. An agent loop only appends, so a few
; recent checkpoints are all it can use.
;
; A/B, qwen3.8-27B-q6-256k, 199k prompt then four turns adding ~15k each (a
; checkpoint needs >= 8192 new tokens, --checkpoint-min-step), child RSS:
;   | turn | 199k | 214k | 228k | 244k | 259k |
;   | 32   | 7.0  | 9.9  | 12.9 | 16.2 | 19.6 |
;   | 4    | 6.9  | 8.0  | 8.2  | 8.5  | 8.7  |
; The router passes this as --swa-checkpoints, an alias of the same flag.
ctx-checkpoints = 4

; -------------------------------------------------------------- Qwen3.8-27B
; DENSE 27B, so no n-cpu-moe — the weights either fit or they do not. Hybrid
; attention (64 layers, 16 with KV) but 4 KV heads x 256, which is 2.7x
; Qwen3-Coder-Next per token: 34,816 B/token at q8_0.
;
; reasoning-budget is required, not cosmetic. reasoning_effort defaults to
; 'xhigh' and on a hard prompt yields ZERO characters of content at max_tokens
; 1200. Setting reasoning_effort to 'low' does not fix it; capping the budget
; does.
;
; MTP: `blk.64` is the model's own Multi-Token-Prediction head, which llama.cpp
; skips unless --spec-type asks for it. The drafter costs a second context
; (~2.5-2.8 GB with its KV and recurrent state), not just the 335 MiB head.
;
; REBUILT 2026-10-05 FOR TWO CARDS (9070 XT + R9700). On one 16 GB card this
; family was five presets, each a different trade: MTP only at 16k/32k and only
; on Q3_K_XL-v3 with q4_0 KV; IQ4_XS only at 32k and only without MTP; q4_0 KV
; at 128k. Every one of those was VRAM. With 48.9 GB none of them binds, so:
;
;   * Every preset runs IQ4_XS-v3 (the more faithful file: KLD 0.0179 against
;     Q3_K_XL-v3's 0.0263, 94.08% top-1 against 92.94%), q8_0 KV, and MTP.
;   * Generation no longer depends on context, so three sizes cover it.
;     The old names are aliases: 16k-mtp/32k-mtp/32k -> 32k, 64k -> 128k.
;   * Q8_0 variants for when fidelity matters more than speed.
;
; 700-token code probe, temp 0, n=3, median. Free is the tightest card (always
; the 9070 XT), from fit.sh at the shipped flags:
;
;   |                  | ub   | tg shallow | draft | free   |
;   | IQ4_XS 32k       | 1024 | 71.38      | 85.1% | 10,847 |
;   | IQ4_XS 128k      |  512 | 71.23*     | 85.1% |  9,138 |
;   | IQ4_XS 256k      |  512 | 71.17*     | 85.1% |  6,754 |
;   | Q8_0 32k         | 1024 | 50.49      | 83.8% |  6,001 |
;   | Q8_0 128k        |  512 | 50.45*     | 83.8% |  4,292 |
;   * probed at -ub 1024; ub does not move generation.
;
; Against what these replace: the old 32k (IQ4_XS, no MTP) ran 31.56 on two
; cards, the old 32k-mtp 68 on Q3_K_XL with q4_0 KV. Without MTP, Q8_0 runs
; 19.1 and IQ4_XS 31.6, so the drafter is worth 2.6x and 2.3x here.
;
; AT REAL 128K DEPTH, one 128,025-token prompt each (scratch probe, as in
; llama-a868c3e3c.md):
;
;   |                               | prefill  | tg at depth       |
;   | new: IQ4_XS+MTP q8_0 -ub 512  | 1054 t/s | 27.32 (draft 60%) |
;   | new: same at -ub 1024         |  920 t/s | 27.80             |
;   | old preset: Q3_K_XL q4_0 -ub512 | 1187 t/s |  9.23           |
;
; Generation at depth triples. Prefill is 11% slower than the old preset,
; which had the lighter file and KV; over a full 128K turn that is 2:01 against
; 1:48 of prefill, then three times the output speed. -ub 512 beats 1024 by
; 15% at depth, the same result llama-a868c3e3c.md found on one card, so the
; long presets keep it; 32k keeps 1024, worth ~12% prefill at shallow depth.
;
; During prefill the R9700 runs at 100% and its 300 W cap while the 9070 XT
; idles about half the time: the auto split gives the R9700 2/3 of the layers.
; An even -ts may speed prefill. Not yet measured.

[qwen3.8-27B-q6-32k]
