; --------------------------------------------------------- Inkling-2-Mini
; Thinking Machines' 26B looped MoE (24 stored layers, 6-18 run three times),
; unsloth UD-Q8_K_XL, 21.29 GiB. Added to the router 2026-11-22. Needs llama.cpp
; with #32704 (690b87d88, in upstream b05204927): without it the looped passes
; run their experts unscaled and every reply is gibberish. 29.5 tok/s
; generation on the main build; the 54 tok/s speedups are on the
; inkling2-speedups branch in ~/llama.cpp-inkling, not merged here.
; See inkling-2-mini-speedups.md.
;
; Mostly sliding-window attention (window 1024, every 6th layer global), so
; the KV cache stays small at long context; trained to 1M. Pinned to the
; R9700, like Gemma. Sampler from the model card: temp 1.0, top-p 1.0,
; top-k 0, min-p 0.
;
; Thinking: the template's reasoning_effort (0-0.99, or none/minimal/low/
; medium/high) sets "Thinking effort level: N"; enable_thinking does nothing.
; Inkling always thinks a little, ~30-100 tokens even at 0. The router's
; thinking-off budget of 0 would force <|end_message|> on each thinking block
; and the model opens another one forever, so the local thinking patch gives
; Inkling's format 1024 tokens instead of 0: "off" = effort 0, a short think,
; then the answer. chat-template-kwargs below makes 0 the default for
; requests with no reasoning_effort (the template's own default is 0.9).
;
; Inkling's attention needs a compute buffer that grows with context x
; ubatch: 12.9 GB at 128K with -ub 512, which does not fit beside the
; 21.3 GiB model. Measured on the R9700: 32K -ub 512 25.8 GiB used, 128K
; -ub 128 28.6 GiB, 128K -ub 256 31.7 GiB (too tight), 256K fails even at
; -ub 64. So 128K runs -ub 128 (slower prefill) and 32K keeps -ub 512.
[inkling-2-mini-q8-32k]
alias = inkling-2-mini-32k,inkling-32k
model            = /home/nipuna/llama.cpp/models/Inkling-2-Mini/Inkling-2-Mini-UD-Q8_K_XL.gguf
ctx-size         = 32768
device           = ROCm1
flash-attn       = on
ubatch-size      = 512
temp             = 1.0
top-p            = 1.0
top-k            = 0
min-p            = 0.0
reasoning-budget = 1024
chat-template-kwargs = {"reasoning_effort":0}

[inkling-2-mini-q8-128k]
alias = inkling-2-mini-128k,inkling-128k
model            = /home/nipuna/llama.cpp/models/Inkling-2-Mini/Inkling-2-Mini-UD-Q8_K_XL.gguf
ctx-size         = 131072
device           = ROCm1
flash-attn       = on
ubatch-size      = 128
temp             = 1.0
top-p            = 1.0
top-k            = 0
min-p            = 0.0
reasoning-budget = 1024
chat-template-kwargs = {"reasoning_effort":0}

; ------------------------------------------------------------- Gemma 4-12B
; DENSE 12B, multimodal (image + experimental audio via the mmproj). Native
; 262144. ggml-org BF16 (22.2 GiB) + BF16 MTP head (0.8 GiB) + BF16 mmproj,
; f16 KV. 31.0 of 32.6 GB on the R9700 at 256K. 49.9 tok/s, MTP 78%.
;
; The Q8_0 (2026-10-28) and Google's QAT Q4_0 (2026-11-20) presets and files
; were removed 2026-11-20. Q8_0 measured BF16-equal on quality at 104 tok/s
; and 19.2 GB; QAT 120 tok/s but 25x the drift. See gemma-4-12b-quants.md.
; Restore Q8_0 from ggml-org/gemma-4-12B-it-GGUF (Q8_0 + mtp Q8_0).
;
; Pinned to the R9700: it fits one card, and small models lose more to the
; hop between cards than they gain.
;
; Vision checked with a red circle + blue rectangle PNG: described correctly.
; "Gemma4Assistant requires ctx_other to be set" during load is the normal
; memory-fitting warning, not a failure.

[gemma4-12B-bf16-vision-256k]
alias = gemma4-12b-bf16-vision-256k
model             = /home/nipuna/llama.cpp/models/gemma-4-12B-it-BF16.gguf
mmproj            = /home/nipuna/llama.cpp/models/mmproj-gemma-4-12B-it-BF16.gguf
model-draft       = /home/nipuna/llama.cpp/models/mtp-gemma-4-12B-it-BF16.gguf
spec-type         = draft-mtp
ctx-size          = 262144
device            = ROCm1
reasoning-budget  = 1024
repeat-penalty    = 1.05
cache-type-k      = f16
cache-type-v      = f16
