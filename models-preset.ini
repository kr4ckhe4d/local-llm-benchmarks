; -------------------------------------------------------------- Qwen3.8-27B
; DENSE 27B, so no n-cpu-moe — the weights either fit or they do not. Hybrid
; attention (64 layers, 16 with KV) but 4 KV heads x 256, which is 2.7x
; Qwen3-Coder-Next per token: 34,816 B/token at q8_0.
;
; ALL PRESETS BELOW USE THE DYNAMIC 3.0 FILE (`-v3` suffix), re-quantised by
; Unsloth 2026-08-19/20. It is 391 MiB lighter than the Dynamic 2.0 file at 32k
; (measured), which is what pays for the ubatch upgrades at 64k and 128k. It is
; also 3.6% slower at generation (30.78 -> 29.67 tok/s, n=3, sd 0.05). That
; trade is taken deliberately: ubatch is worth ~12% prompt, and long agentic
; histories spend far more time in prefill than in generation.
;
; The Dynamic 2.0 file is still on disk, unwired, as the comparison baseline.
; Switch `model =` back to `Qwen3.8-27B-UD-Q3_K_XL.gguf` to get the 3.6% back.
;
; reasoning-budget is required, not cosmetic. reasoning_effort defaults to
; 'xhigh' and on a hard prompt yields ZERO characters of content at max_tokens
; 1200. Setting reasoning_effort to 'low' does not fix it; capping the budget
; does.

; MTP speculative decoding: 2.34x generation (29.70 -> 69.47 tok/s) and
; follow-up latency of ~1s instead of ~2.5s. `blk.64` is the model's own
; Multi-Token-Prediction head, which llama.cpp skips unless --spec-type asks
; for it. The cost is a FIXED ~2,212 MiB — a second full context, not the
; 198.8 MiB of blk.64 weights — independent of ctx and batch size. That is why
; this preset stops at 16k: 24k leaves 95 MiB and 32k leaves 33 MiB, both
; inside desktop VRAM drift. At 16k it leaves 415 MiB, verified under a real
; 14,358-token prompt with 5/5 needle recall.
[qwen3.8-27B-16k-mtp]
alias = qwen3.8-16k-mtp
model            = /home/nipuna/llama.cpp/models/Qwen3.8-27B-UD-Q3_K_XL-v3.gguf
ctx-size         = 16384
ubatch-size      = 512
batch-size       = 2048
flash-attn       = on
cache-type-k     = q8_0
cache-type-v     = q8_0
spec-type        = draft-mtp
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
reasoning-budget = 1024

; REPOINTED TO UD-IQ4_XS 2026-08-21. This preset used UD-Q3_K_XL-v3; IQ4_XS is
; better on quality AND speed at once, measured back-to-back with identical
; flags in one session:
;
;   |                | Q3_K_XL v3        | IQ4_XS v3         |
;   | generation n=3 | 29.70 +/- 0.06    | 30.27 +/- 0.014   |
;   | mean KLD       | 0.0263            | 0.0179  (-32%)    |
;   | same top-1     | 92.94%            | 94.08%            |
;   | VRAM at 32k    | 14,280 MiB        | 15,343 MiB        |
;
; The bigger file being faster is not a fluke: Dynamic 3.0 spends fourteen ggml
; quant types against v2's five, already measured at 3.6% of generation. IQ4_XS
; has fewer dequant paths, so Q3_K_XL-v3 was paying a dequant tax for a quant
; that is also less faithful.
;
; COST: headroom. 955 MiB free, against ~2,000 on Q3_K_XL. Still well over the
; 281 MiB this repo treats as the danger line, but less room for a browser or
; Resolve. If you need that GB back, switch `model =` to
; Qwen3.8-27B-UD-Q3_K_XL-v3.gguf and change nothing else -- the flags are
; identical and were verified against both files.
;
; DIVERGENCE, DELIBERATE: `switch-model.sh qwen3.8 32k` still serves
; UD-Q3_K_XL-v3. That key also drives 16k/64k/128k, where IQ4_XS is 1.1 GB
; heavier and has NOT been fit-tested. Only the router's 32k preset moved.
[qwen3.8-27B-32k]
alias = qwen3.8-32k
model            = /home/nipuna/llama.cpp/models/Qwen3.8-27B-UD-IQ4_XS-v3.gguf
ctx-size         = 32768
ubatch-size      = 1024
batch-size       = 2048
flash-attn       = on
cache-type-k     = q8_0
cache-type-v     = q8_0
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
reasoning-budget = 1024

