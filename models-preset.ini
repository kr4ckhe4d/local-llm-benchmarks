; ----------------------------------------------------------- Gemma 4-26B-A4B
; NOT hybrid attention — VRAM scales badly with context. Native 262144.
; Also a thinking model: reasoning is unbounded by default and will consume the
; entire token budget. Capped here rather than disabled.
;
; MTP speculative decoding, added 2026-08-29. Unlike Qwen3.8 (head in-file as
; blk.64) Gemma 4 ships the drafter as a SEPARATE 462MB file, so it needs
; model-draft as well as spec-type. Measured 1.79x generation at 32k
; (51.2 -> 93.0 tok/s), 84% draft acceptance, mean run 3.5 tokens.
;
; The drafter carries its own KV cache, so its cost GROWS with context: ~550MiB
; at 32k but ~1,300MiB at 128k. That is why 128k moved from n-cpu-moe 12 to 13
; — at 12 with MTP the fit leaves only 425 MiB, at 13 it leaves 880.
;
; NO CPU OFFLOAD since 2026-10-05 (R9700), drafter included. The fastest model
; on the box, and flat with context:
; 700-token code probe, temp 0, n=3, median; "as written" is the old preset on
; today's two cards (auto split), so it is the fair before. Free is the
; tightest card, always the 9070 XT, from fit.sh with a real 2,560-token probe.
;
;   |      | as written      | no offload | gain  | free     |
;   | 32k  | 92.62 (ncmoe 8) | 143.50     | +55%  | 8,930    |
;   | 128k | 79.01 (ncmoe13) | 143.64     | +82%  | 8,162    |
;   | 256k | 68.25 (ncmoe20) | 142.45     | +109% | 6,998    |

