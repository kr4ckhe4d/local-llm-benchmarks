; -------------------------------------------------------------- Gemma 4-E2B
; DENSE, 35 layers, 1 KV head -- only 7 of 35 layers keep KV (period-5, rest
; are 512-token sliding window). Native 131072 fits whole in under 6GB, so
; 128k here IS native, not a VRAM-capped subset. No n-cpu-moe (dense) and no
; KV quant needed at any context. Fastest generation measured on this card
; (~75 tok/s) but the weakest coding score measured (17/50) -- see README.
;
; IS a thinking model, and reasoning-budget is not optional here -- unlike
; Instella-MoE's fork (see instella-moe.md), this chat template DOES split
; reasoning_content correctly, but with no cap the model burns the entire
; max_tokens budget on thinking and returns empty content. Confirmed: at
; max_tokens 500 with the budget set, it still returned content="" (500 <
; 1024 budget, so the cutover to content never got reached). At max_tokens
; 2000 it worked (2319 chars reasoning, 5684 chars real code). A client
; sending a small max_tokens can still see this — it is not fully fixed by
; the server flag alone, only bounded to "budget + headroom" instead of
; unbounded.

[gemma4-E2B-32k]
alias = gemma4-e2b-32k
model        = /home/nipuna/llama.cpp/models/gemma-4-E2B-it-BF16.gguf
ctx-size     = 32768
ubatch-size  = 1024
batch-size   = 2048
flash-attn   = on
reasoning-budget = 1024

[gemma4-E2B-128k]
alias = gemma4-e2b-128k
model        = /home/nipuna/llama.cpp/models/gemma-4-E2B-it-BF16.gguf
ctx-size     = 131072
