; --------------------------------------------------------- Laguna XS.2 Q8_0
; Near-lossless. Same coding quality as Q4_K_M (27/50 both) but +25 points on
; cdn-freshness -- version-string recall is what quantisation costs here, not
; coding ability. 30.2 tok/s vs Q4_K_M's 47. More experts on CPU means a
; roomier long-context fit than Q4_K_M despite the larger file.
;
; 2026-10-05 (R9700): the speed argument above is gone. With no offload Q8 runs
; at 80 tok/s, 89% of Q4's 90, so for anything where version recall matters
; this is now the better Laguna. 32k and 128k need no offload; 256k keeps 2
; layers on the CPU. The file is bigger than the 32 GB of RAM, which is what
; forced load-mode = dio in [*]: through mmap it never finished loading.
; 700-token code probe, temp 0, n=3, median; "as written" is the old preset on
; today's two cards (auto split), so it is the fair before. Free is the
; tightest card, always the 9070 XT, from fit.sh with a real 2,560-token probe.
;
;   |      | as written      | new         | gain  | free     |
;   | 32k  | 40.99 (ncmoe26) | 80.34       | +96%  | 3,314    |
;   | 128k | 38.54 (ncmoe30) | 80.32       | +108% | 1,346    |
;   | 256k | 36.17 (ncmoe34) | 75.94 (ncmoe 2) | +110% | 1,116 |
