; --------------------------------------------------------------- GLM-4.7-Flash
; First non-Qwen model, first MLA-attention model (arch reports as deepseek2 —
; it reuses DeepSeek-V2's MLA code path). 30B total / ~3B active MoE, 47
; layers (1 dense + 46 MoE, 64 experts, 4 active), native 202752.
;
; Weights (17.52GB) exceed 16GB VRAM by only ~800 MiB — the smallest deficit
; of any MoE model here — so n-cpu-moe needed is far lower than Qwen3.6's
; floor of 16, despite a similar total file size. See README for the full
; n-cpu-moe sweep and the measured MLA KV-cost finding (~27,915 B/token,
; cheaper than Qwen3.8's 34,816 despite running at every layer, not a sparse
; subset).
;
; Sampling is Z.ai's own recommendation for general use (temp 1.0/top-p 0.95),
; not their tool-calling-specific one (temp 0.7/top-p 1.0) — this preset
; serves both from one config, same as everything else in this file.
; min-p 0.01 because llama.cpp's own default (0.05) is higher than upstream's.
;
; q8_0 KV confirmed working for MLA on this build — not something to assume
; going in for a new architecture.

[glm-4.7-flash-30B-A3B-32k]
alias = glm4.7-flash-32k
model            = /home/nipuna/llama.cpp/models/GLM-4.7-Flash-UD-Q4_K_XL.gguf
ctx-size         = 32768
n-cpu-moe        = 12
ubatch-size      = 1024
batch-size       = 2048
flash-attn       = on
cache-type-k     = q8_0
cache-type-v     = q8_0
temp             = 1.0
top-p            = 0.95
min-p            = 0.01
repeat-penalty   = 1.0
reasoning-budget = 1024

[glm-4.7-flash-30B-A3B-128k]
alias = glm4.7-flash-128k
model            = /home/nipuna/llama.cpp/models/GLM-4.7-Flash-UD-Q4_K_XL.gguf
ctx-size         = 131072
n-cpu-moe        = 20
ubatch-size      = 1024
batch-size       = 2048
flash-attn       = on
cache-type-k     = q8_0
cache-type-v     = q8_0
temp             = 1.0
top-p            = 0.95
min-p            = 0.01
repeat-penalty   = 1.0
reasoning-budget = 1024

; Native ceiling (202752, not a round 256k — see README). -ub 512, not 1024,
; to buy back compute-buffer headroom, same trick as qwen3.8's 128k preset.
[glm-4.7-flash-30B-A3B-200k]
alias = glm4.7-flash-200k
model            = /home/nipuna/llama.cpp/models/GLM-4.7-Flash-UD-Q4_K_XL.gguf
ctx-size         = 202752
n-cpu-moe        = 28
ubatch-size      = 512
batch-size       = 2048
flash-attn       = on
cache-type-k     = q8_0
cache-type-v     = q8_0
temp             = 1.0
top-p            = 0.95
min-p            = 0.01
repeat-penalty   = 1.0
reasoning-budget = 1024

