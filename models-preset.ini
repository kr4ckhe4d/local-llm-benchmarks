version = 1

; llama-server router presets — pick any of these from Open WebUI's model
; dropdown and the router loads it on demand, unloading the previous one.
;
; Section names carry the parameter count because the section name IS the label
; Open WebUI shows: llama.cpp overwrites LLAMA_ARG_ALIAS with it when spawning
; each child, so there is no separate display-name field. Format is
; <model>-<total>B[-A<active>B]-<ctx>; the A-suffix marks MoE active params.
;
; Each section also keeps 'alias = <old-name>' so chats created before the
; rename still resolve. Aliases route but are not listed in /v1/models —
; verified: an unknown model 400s in ~1ms, while the old name loads normally.
;
; Values mirror the verified configs in switch-model.sh. Two caveats:
;   * Every model here runs on whichever binary the router was launched with.
;     The router is started from build/ (ROCm), so gpt-oss-20b loses the Vulkan
;     generation advantage it has at 32k (181 vs 148 tok/s). Everything else
;     prefers ROCm anyway.
;   * Launch the router with --models-max 1. This card has 16GB; loading a
;     second model alongside the first will fail to allocate.

[*]
n-gpu-layers = 99
parallel     = 1

; ---------------------------------------------------------------- GPT-OSS-20B
; Native 131072 (already YaRN 32x from a 4096 base). No offload needed.

[gpt-oss-20b-A3.6B-32k]
alias = gpt-oss-20b-32k
model    = /home/nipuna/llama.cpp/models/gpt-oss-20b-mxfp4.gguf
ctx-size = 32768

[gpt-oss-20b-A3.6B-128k]
alias = gpt-oss-20b-128k
model    = /home/nipuna/llama.cpp/models/gpt-oss-20b-mxfp4.gguf
ctx-size = 131072

; ------------------------------------------------------------ Qwen3.6-35B-A3B
; Hybrid attention, 40 layers, 10 with KV. Native 262144.

[qwen3.6-35B-A3B-32k]
alias = qwen3.6-32k
model        = /home/nipuna/llama.cpp/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
ctx-size     = 32768
n-cpu-moe    = 16
ubatch-size  = 1024
batch-size   = 2048
flash-attn   = on
cache-type-k = q8_0
cache-type-v = q8_0

[qwen3.6-35B-A3B-128k]
alias = qwen3.6-128k
model        = /home/nipuna/llama.cpp/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
ctx-size     = 131072
n-cpu-moe    = 20
ubatch-size  = 1024
batch-size   = 2048
flash-attn   = on
cache-type-k = q8_0
cache-type-v = q8_0

[qwen3.6-35B-A3B-256k]
alias = qwen3.6-256k
model        = /home/nipuna/llama.cpp/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
ctx-size     = 262144
n-cpu-moe    = 24
ubatch-size  = 1024
batch-size   = 2048
flash-attn   = on
cache-type-k = q8_0
cache-type-v = q8_0

; ----------------------------------------------------------- Gemma 4-26B-A4B
; NOT hybrid attention — VRAM scales badly with context. Native 262144.
; Also a thinking model: reasoning is unbounded by default and will consume the
; entire token budget. Capped here rather than disabled.

[gemma4-26B-A4B-32k]
alias = gemma4-32k
model             = /home/nipuna/llama.cpp/models/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
ctx-size          = 32768
n-cpu-moe         = 8
reasoning-budget  = 1024
repeat-penalty    = 1.05

[gemma4-26B-A4B-128k]
alias = gemma4-128k
model             = /home/nipuna/llama.cpp/models/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
ctx-size          = 131072
n-cpu-moe         = 12
reasoning-budget  = 1024
repeat-penalty    = 1.05

[gemma4-26B-A4B-256k]
alias = gemma4-256k
model             = /home/nipuna/llama.cpp/models/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
ctx-size          = 262144
n-cpu-moe         = 20
reasoning-budget  = 1024
repeat-penalty    = 1.05

; --------------------------------------------------------- Qwen3-Coder-Next
; Hybrid attention, 48 layers, 12 with KV. Native 262144. ~47GB host RAM.
; 49GB model — expect a slow cold load on first switch.

[qwen3-coder-80B-A3B-32k]
alias = qwen3-coder-32k
model        = /home/nipuna/llama.cpp/models/Qwen3-Coder-Next-UD-Q4_K_M.gguf
ctx-size     = 32768
n-cpu-moe    = 38
ubatch-size  = 1024
batch-size   = 2048
flash-attn   = on
cache-type-k = q8_0
cache-type-v = q8_0

[qwen3-coder-80B-A3B-128k]
alias = qwen3-coder-128k
model        = /home/nipuna/llama.cpp/models/Qwen3-Coder-Next-UD-Q4_K_M.gguf
ctx-size     = 131072
n-cpu-moe    = 40
ubatch-size  = 1024
batch-size   = 2048
flash-attn   = on
cache-type-k = q8_0
cache-type-v = q8_0

[qwen3-coder-80B-A3B-256k]
alias = qwen3-coder-256k
model        = /home/nipuna/llama.cpp/models/Qwen3-Coder-Next-UD-Q4_K_M.gguf
ctx-size     = 262144
n-cpu-moe    = 42
ubatch-size  = 1024
batch-size   = 2048
flash-attn   = on
cache-type-k = q8_0
cache-type-v = q8_0

; --------------------------------------------------------- Muse Glimmer 30B
; Dense, so no n-cpu-moe. Native 131072. reasoning_strength defaults to 'high'
; and eats the whole token budget before writing content — must be set here.
; DFlash drafter is worth 1.64x but costs ~0.9GB, so it is dropped at 128k.

[muse-glimmer-30B-32k]
alias = muse-glimmer-32k
model                = /home/nipuna/llama.cpp/models/Muse-Glimmer-30B-UD-Q3_K_XL.gguf
model-draft          = /home/nipuna/llama.cpp/models/dflash-kquant.gguf
spec-type            = draft-dflash
ctx-size             = 32768
ubatch-size          = 512
flash-attn           = on
cache-type-k         = q8_0
cache-type-v         = q8_0
temp                 = 1.0
top-p                = 0.95
top-k                = 64
chat-template-kwargs = {"reasoning_strength":"low"}
load-on-startup      = true

[muse-glimmer-30B-64k]
alias = muse-glimmer-64k
model                = /home/nipuna/llama.cpp/models/Muse-Glimmer-30B-UD-Q3_K_XL.gguf
model-draft          = /home/nipuna/llama.cpp/models/dflash-kquant.gguf
spec-type            = draft-dflash
ctx-size             = 65536
ubatch-size          = 256
flash-attn           = on
cache-type-k         = q8_0
cache-type-v         = q8_0
temp                 = 1.0
top-p                = 0.95
top-k                = 64
chat-template-kwargs = {"reasoning_strength":"low"}

[muse-glimmer-30B-128k]
alias = muse-glimmer-128k
model                = /home/nipuna/llama.cpp/models/Muse-Glimmer-30B-UD-Q3_K_XL.gguf
ctx-size             = 131072
flash-attn           = on
cache-type-k         = q8_0
cache-type-v         = q8_0
temp                 = 1.0
top-p                = 0.95
top-k                = 64
chat-template-kwargs = {"reasoning_strength":"low"}

; -------------------------------------------------------------- Qwen3.8-27B
; DENSE 27B, so no n-cpu-moe — the weights either fit or they do not. Hybrid
; attention (64 layers, 16 with KV) but 4 KV heads x 256, which is 2.7x
; Qwen3-Coder-Next per token: 34,816 B/token at q8_0. Native 262144 is NOT
; reachable on this card and is deliberately absent below.
;
; 128k fits only at q4_0 KV *and* ubatch 256 (281 MiB free). Verified under a
; 127,116-token prompt without OOM, because the compute buffer is sized from
; ubatch at load and does not grow with prompt length. It leaves no room for a
; second GPU consumer — close Resolve before selecting it.
;
; reasoning-budget is required, not cosmetic. reasoning_effort defaults to
; 'xhigh' and on a hard prompt yields ZERO characters of content at max_tokens
; 1200. Setting reasoning_effort to 'low' does not fix it; capping the budget
; does.

[qwen3.8-27B-32k]
alias = qwen3.8-32k
model            = /home/nipuna/llama.cpp/models/Qwen3.8-27B-UD-Q3_K_XL.gguf
ctx-size         = 32768
ubatch-size      = 1024
batch-size       = 2048
flash-attn       = on
cache-type-k     = q8_0
cache-type-v     = q8_0
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
reasoning-budget = 1024

; q8_0 KV, not q4_0, despite the tighter fit — q4_0 costs up to 23% of
; generation at depth, which is exactly what this preset is for. ubatch 512
; buys back the compute buffer q8_0 needs.
[qwen3.8-27B-64k]
alias = qwen3.8-64k
model            = /home/nipuna/llama.cpp/models/Qwen3.8-27B-UD-Q3_K_XL.gguf
ctx-size         = 65536
ubatch-size      = 512
batch-size       = 2048
flash-attn       = on
cache-type-k     = q8_0
cache-type-v     = q8_0
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
reasoning-budget = 1024

[qwen3.8-27B-128k]
alias = qwen3.8-128k
model            = /home/nipuna/llama.cpp/models/Qwen3.8-27B-UD-Q3_K_XL.gguf
ctx-size         = 131072
ubatch-size      = 256
batch-size       = 2048
flash-attn       = on
cache-type-k     = q4_0
cache-type-v     = q4_0
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
reasoning-budget = 1024

; ------------------------------------------- Qwen3.5-27B-Uncensored (HauhauCS)
; DENSE 27B, arch qwen35 — architecturally the same model as Qwen3.8-27B above,
; one base version back, so the same rules apply: no n-cpu-moe, and native
; 262144 is not reachable on this card.
;
; It runs 266 MiB heavier than Qwen3.8 at 64k, which is enough to remove the
; q8_0-at-64k option that preset relies on: q8_0 there leaves 55 MiB, inside
; the range the desktop's own VRAM moves during a session. So 64k takes q4_0
; and its ~23% generation penalty at depth. At 32k the gap is only 67 MiB and
; q8_0 is comfortable — prefer 32k on this model.
;
; 128k is deliberately absent. It loads at 32 MiB free, which is less than the
; measured desktop baseline drift (395-701 MiB in one session). See README.
;
; Thinking model with enable_thinking and no reasoning_effort, same as Qwen3.8,
; so reasoning-budget applies for the same reason.

[qwen3.5-27B-uncensored-32k]
alias = qwen3.5-uncensored-32k
model            = /home/nipuna/llama.cpp/models/Qwen3.5-27B-Uncensored-Q3_K_M.gguf
ctx-size         = 32768
ubatch-size      = 1024
batch-size       = 2048
flash-attn       = on
cache-type-k     = q8_0
cache-type-v     = q8_0
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
reasoning-budget = 1024

; q4_0 KV, unlike qwen3.8-27B-64k — not a preference, a constraint. See above.
[qwen3.5-27B-uncensored-64k]
alias = qwen3.5-uncensored-64k
model            = /home/nipuna/llama.cpp/models/Qwen3.5-27B-Uncensored-Q3_K_M.gguf
ctx-size         = 65536
ubatch-size      = 512
batch-size       = 2048
flash-attn       = on
cache-type-k     = q4_0
cache-type-v     = q4_0
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
reasoning-budget = 1024

; -------------------------------------------- Qwen3.5-9B-Uncensored (HauhauCS)
; DENSE 9B, arch qwen35, same family as the 27B above but 32 layers not 64 —
; half the layers-with-KV (8 vs 16), same 4 KV heads, so half the per-token KV
; cost. That is why this one reaches native 262144 at full q8_0 KV with real
; headroom (1,304 MiB free), where the 27B twin cannot get past 128k even with
; q4_0. q8_0 KV and -ub 1024 hold at every context here — no tradeoff needed.
;
; Thinking model, same profile as the rest of the family: reasoning-budget is
; required for the same reason as qwen3.8 and the 27B-uncensored above.

[qwen3.5-9B-uncensored-32k]
alias = qwen3.5-9b-uncensored-32k
model            = /home/nipuna/llama.cpp/models/Qwen3.5-9B-Uncensored-Q8_0.gguf
ctx-size         = 32768
ubatch-size      = 1024
batch-size       = 2048
flash-attn       = on
cache-type-k     = q8_0
cache-type-v     = q8_0
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
reasoning-budget = 1024

[qwen3.5-9B-uncensored-128k]
alias = qwen3.5-9b-uncensored-128k
model            = /home/nipuna/llama.cpp/models/Qwen3.5-9B-Uncensored-Q8_0.gguf
ctx-size         = 131072
ubatch-size      = 1024
batch-size       = 2048
flash-attn       = on
cache-type-k     = q8_0
cache-type-v     = q8_0
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
reasoning-budget = 1024

; Native ceiling. 1,304 MiB free — real headroom, not a fragile edge case.
[qwen3.5-9B-uncensored-256k]
alias = qwen3.5-9b-uncensored-256k
model            = /home/nipuna/llama.cpp/models/Qwen3.5-9B-Uncensored-Q8_0.gguf
ctx-size         = 262144
ubatch-size      = 1024
batch-size       = 2048
flash-attn       = on
