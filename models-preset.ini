version = 1

; llama-server router presets — pick any of these from Open WebUI's model
; dropdown and the router loads it on demand, unloading the previous one.
;
; Section names carry the parameter count because the section name IS the label
; Open WebUI shows: llama.cpp overwrites LLAMA_ARG_ALIAS with it when spawning
; each child, so there is no separate display-name field. Format is
; <model>-<total>B[-A<active>B]-<ctx>; the A-suffix marks MoE active params.
;
; Each section also keeps 'alias = <old-name>' so chats created before the
; rename still resolve. Aliases route but are not listed in /v1/models —
; verified: an unknown model 400s in ~1ms, while the old name loads normally.
;
; Values mirror the verified configs in switch-model.sh. Two caveats:
;   * Every model here runs on whichever binary the router was launched with.
;     The router is started from build/ (ROCm), so gpt-oss-20b loses the Vulkan
;     generation advantage it has at 32k (181 vs 148 tok/s). Everything else
;     prefers ROCm anyway.
;   * Launch the router with --models-max 1. Since 2026-10-05 there are two
;     cards, a 9070 XT (16,304 MiB) and an R9700 (32,624 MiB), and llama.cpp
;     splits every preset across both with no flag. 48.9 GB is still not room
;     for two residents: the MoE presets below now take 19-43 GB each.
;
; TWO CARDS, measured 2026-10-05. Both run off CPU root ports at PCIe 5.0 x8
; (x8/x8 bifurcation; each card's internal switch reports x16, which is not the
; slot). Layer split runs them in turn, so a dense model gains nothing from
; the second card beyond room: Qwen3.8-27B IQ4_XS at 32K went 30.27 -> 31.57.
; MoE gains a lot, because it no longer needs CPU expert offload at all -- see
; each MoE family below. On every preset the 9070 XT is the tight card: it gets
; ~1/3 of the layers plus the desktop. fit.sh reports it per card.

[*]
n-gpu-layers = 99
parallel     = 1
; DirectIO loading, added 2026-10-05. Since the RAM went to 32 GB, mmap pages
; any model near that size through a thrashing page cache: Laguna Q8 (35.6 GB)
; did not finish loading in 300 s. dio loaded it in 10. For a 22 GB model with
; a warm cache, mmap is quicker (1.8 s against 3.8), but dio is the same 3.8 s
; every time and never falls off the cliff, and the router rarely finds a
; warm cache when it switches models anyway.
load-mode    = dio

; ---------------------------------------------------------------- GPT-OSS-20B
; Native 131072 (already YaRN 32x from a 4096 base). No offload needed.
;
; PINNED TO THE R9700 (device = ROCm1) since 2026-10-06. It fits one card with
; room, and the auto split across both cost 10%: 132.92 tok/s split against
; 147.10 on the R9700 alone, same build, 700-token probe (r9700+rx9070.md).
; Small models spend relatively more of each token on the hop between cards.
; Pinning also leaves the 9070 XT idle. ROCm1 is the llama.cpp name for the
; R9700; DRM and nvtop number the cards differently.

[gpt-oss-20b-A3.6B-32k]
alias = gpt-oss-20b-32k
model    = /home/nipuna/llama.cpp/models/gpt-oss-20b-mxfp4.gguf
ctx-size = 32768
device   = ROCm1

[gpt-oss-20b-A3.6B-128k]
alias = gpt-oss-20b-128k
model    = /home/nipuna/llama.cpp/models/gpt-oss-20b-mxfp4.gguf
ctx-size = 131072
device   = ROCm1

; ------------------------------------------------------------ Qwen3.6-35B-A3B
; Hybrid attention, 40 layers, 10 with KV. Native 262144.
;
; NO CPU OFFLOAD since 2026-10-05 (R9700). The model and its 256K KV fit across
; both cards, so n-cpu-moe is gone from all three presets. Generation is now
; flat with context because nothing streams experts from host memory:
; 700-token code probe, temp 0, n=3, median; "as written" is the old preset on
; today's two cards (auto split), so it is the fair before. Free is the
; tightest card, always the 9070 XT, from fit.sh with a real 2,560-token probe.
;
;   |      | as written      | no offload | gain | free     |
;   | 32k  | 52.91 (ncmoe16) | 73.93      | +40% | 7,731    |
;   | 128k | 50.12 (ncmoe20) | 73.96      | +48% | 6,496    |
;   | 256k | 47.49 (ncmoe24) | 73.73      | +55% | 4,808    |
;
; "As written" was already 9% BELOW the single-card 58.12 at 32k (ddr5-9800x3d.md):
; splitting layers across two cards while experts sit on the CPU adds hops.
; Do not reintroduce n-cpu-moe here without measuring that again.
;
; Sampling + reasoning-budget added 2026-09-26 after a 128k chat looped: the
; model repeated an eight-line checklist in its thinking until max_tokens (about
; 20.9k generated, zero content). These presets had no sampling lines at all,
; so it ran on the GGUF defaults (temp 1.0, top-k 20, top-p 0.95) with no
; presence penalty and no cap on thinking. presence-penalty 1.5 is Qwen's own
; recommendation for thinking mode, aimed at exactly this. The budget is
; 4096, not Qwen3.8's 1024: a healthy research turn in the same log thought for
; 3,943 tokens, and 1024 would have cut it off.

[qwen3.6-35B-A3B-32k]
alias = qwen3.6-32k
