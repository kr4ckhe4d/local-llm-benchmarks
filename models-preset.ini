;   | 32k  | 53.76 (ncmoe12) | 74.88      | +39% | 8,919    |
;   | 128k | 45.43 (ncmoe20) | 74.77      | +65% | 7,251    |
;   | 200k | 40.25 (ncmoe28) | 74.80      | +86% | 6,885    |

