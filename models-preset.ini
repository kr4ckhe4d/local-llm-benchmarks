; ------------------------------------------------ Qwen3.8-27B at UD-Q6_K
; THE QUALITY CEILING, AND IT IS SLOW. Measured 2026-08-21 by KL-divergence
; against the BF16 weights: mean KLD 0.0020 and 97.96% top-1 agreement, against
; 0.0263 / 92.94% for UD-Q3_K_XL-v3. That is 13x lower divergence — the largest
; single quality step available on this model.
;
; It is the only preset here that CANNOT run fully offloaded. Weights are
; 20,965 MiB against 16,304 MiB of VRAM, so `n-gpu-layers` overrides the [*]
; default of 99 and the remaining 22 layers run out of DDR4.
;
; -ngl 42 is the ceiling, measured: 495 MiB free, GTT +6. `-ngl 44` looks like
; a fit on peak VRAM but actually loads at 24 MiB free with GTT up 1,623 MiB —
; a host-memory spill. Do not raise this number without re-running fit.sh.
;
; f16 KV is affordable here precisely BECAUSE 22 layers left the card. The
; constraint moved from the cache to the weights, so this is the only Qwen3.8
; preset that does not pay for context with KV precision.
;
; THE COST: 4.24 tok/s generation (n=3, sd 0.005), 470 tok/s prefill at batch
; 2048 — 7x and 2.5x slower than qwen3.8-27B-32k. A 700-token answer takes
; 165s. With reasoning-budget 1024 a typical turn is ~1,800 tokens, so expect
; ~7 minutes per response. This is a batch preset, not an interactive one, and
; it will feel broken in a chat UI if you are not expecting that.
;
; Verified end-to-end through the router, not merely registered: the spawned
; child carries `--n-gpu-layers 42 --cache-type-k f16 --cache-type-v f16`, so
; the per-section override of the [*] default of 99 does take. Under real Open
; WebUI load VRAM sat at 15,301 MiB with GTT flat at 280 — no spill.
[qwen3.8-27B-q6k-32k]
alias = qwen3.8-q6k-32k
model            = /home/nipuna/llama.cpp/models/Qwen3.8-27B-UD-Q6_K-v3.gguf
ctx-size         = 32768
n-gpu-layers     = 42
threads          = 16
ubatch-size      = 512
batch-size       = 2048
flash-attn       = on
cache-type-k     = f16
cache-type-v     = f16
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
reasoning-budget = 1024

