version = 1

; llama-server router presets — pick any of these from Open WebUI's model
; dropdown and the router loads it on demand, unloading the previous one.
;
; Values mirror the verified configs in switch-model.sh. Two caveats:
;   * Every model here runs on whichever binary the router was launched with.
;     The router is started from build/ (ROCm), so gpt-oss-20b loses the Vulkan
;     generation advantage it has at 32k (181 vs 148 tok/s). Everything else
;     prefers ROCm anyway.
;   * Launch the router with --models-max 1. This card has 16GB; loading a
;     second model alongside the first will fail to allocate.

[*]
n-gpu-layers = 99
parallel     = 1

; ---------------------------------------------------------------- GPT-OSS-20B
; Native 131072 (already YaRN 32x from a 4096 base). No offload needed.

[gpt-oss-20b-32k]
model    = /home/nipuna/llama.cpp/models/gpt-oss-20b-mxfp4.gguf
ctx-size = 32768

[gpt-oss-20b-128k]
model    = /home/nipuna/llama.cpp/models/gpt-oss-20b-mxfp4.gguf
ctx-size = 131072

; ------------------------------------------------------------ Qwen3.6-35B-A3B
; Hybrid attention, 40 layers, 10 with KV. Native 262144.

[qwen3.6-32k]
model        = /home/nipuna/llama.cpp/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
ctx-size     = 32768
n-cpu-moe    = 16
ubatch-size  = 1024
batch-size   = 2048
flash-attn   = on
cache-type-k = q8_0
cache-type-v = q8_0

[qwen3.6-128k]
model        = /home/nipuna/llama.cpp/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
ctx-size     = 131072
n-cpu-moe    = 20
ubatch-size  = 1024
batch-size   = 2048
flash-attn   = on
cache-type-k = q8_0
cache-type-v = q8_0

[qwen3.6-256k]
model        = /home/nipuna/llama.cpp/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
ctx-size     = 262144
n-cpu-moe    = 24
ubatch-size  = 1024
batch-size   = 2048
flash-attn   = on
cache-type-k = q8_0
cache-type-v = q8_0

; ----------------------------------------------------------- Gemma 4-26B-A4B
; NOT hybrid attention — VRAM scales badly with context. Native 262144.
; Also a thinking model: reasoning is unbounded by default and will consume the
; entire token budget. Capped here rather than disabled.

[gemma4-32k]
model             = /home/nipuna/llama.cpp/models/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
ctx-size          = 32768
n-cpu-moe         = 8
reasoning-budget  = 1024
repeat-penalty    = 1.05

[gemma4-128k]
model             = /home/nipuna/llama.cpp/models/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
ctx-size          = 131072
n-cpu-moe         = 12
reasoning-budget  = 1024
repeat-penalty    = 1.05

[gemma4-256k]
model             = /home/nipuna/llama.cpp/models/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
ctx-size          = 262144
n-cpu-moe         = 20
reasoning-budget  = 1024
repeat-penalty    = 1.05

; --------------------------------------------------------- Qwen3-Coder-Next
; Hybrid attention, 48 layers, 12 with KV. Native 262144. ~47GB host RAM.
; 49GB model — expect a slow cold load on first switch.

[qwen3-coder-32k]
model        = /home/nipuna/llama.cpp/models/Qwen3-Coder-Next-UD-Q4_K_M.gguf
ctx-size     = 32768
n-cpu-moe    = 38
ubatch-size  = 1024
batch-size   = 2048
flash-attn   = on
cache-type-k = q8_0
cache-type-v = q8_0

[qwen3-coder-128k]
model        = /home/nipuna/llama.cpp/models/Qwen3-Coder-Next-UD-Q4_K_M.gguf
ctx-size     = 131072
n-cpu-moe    = 40
ubatch-size  = 1024
batch-size   = 2048
flash-attn   = on
cache-type-k = q8_0
cache-type-v = q8_0

[qwen3-coder-256k]
model        = /home/nipuna/llama.cpp/models/Qwen3-Coder-Next-UD-Q4_K_M.gguf
ctx-size     = 262144
n-cpu-moe    = 42
ubatch-size  = 1024
batch-size   = 2048
flash-attn   = on
cache-type-k = q8_0
cache-type-v = q8_0

; --------------------------------------------------------- Muse Glimmer 30B
; Dense, so no n-cpu-moe. Native 131072. reasoning_strength defaults to 'high'
; and eats the whole token budget before writing content — must be set here.
; DFlash drafter is worth 1.64x but costs ~0.9GB, so it is dropped at 128k.

[muse-glimmer-32k]
model                = /home/nipuna/llama.cpp/models/Muse-Glimmer-30B-UD-Q3_K_XL.gguf
model-draft          = /home/nipuna/llama.cpp/models/dflash-kquant.gguf
spec-type            = draft-dflash
ctx-size             = 32768
ubatch-size          = 512
flash-attn           = on
cache-type-k         = q8_0
cache-type-v         = q8_0
temp                 = 1.0
top-p                = 0.95
top-k                = 64
chat-template-kwargs = {"reasoning_strength":"low"}
load-on-startup      = true

[muse-glimmer-64k]
model                = /home/nipuna/llama.cpp/models/Muse-Glimmer-30B-UD-Q3_K_XL.gguf
model-draft          = /home/nipuna/llama.cpp/models/dflash-kquant.gguf
spec-type            = draft-dflash
ctx-size             = 65536
ubatch-size          = 256
flash-attn           = on
cache-type-k         = q8_0
cache-type-v         = q8_0
temp                 = 1.0
top-p                = 0.95
top-k                = 64
chat-template-kwargs = {"reasoning_strength":"low"}

[muse-glimmer-128k]
model                = /home/nipuna/llama.cpp/models/Muse-Glimmer-30B-UD-Q3_K_XL.gguf
ctx-size             = 131072
flash-attn           = on
cache-type-k         = q8_0
cache-type-v         = q8_0
temp                 = 1.0
top-p                = 0.95
top-k                = 64
chat-template-kwargs = {"reasoning_strength":"low"}

; -------------------------------------------------------------- Qwen3.8-27B
; DENSE 27B, so no n-cpu-moe — the weights either fit or they do not. Hybrid
; attention (64 layers, 16 with KV) but 4 KV heads x 256, which is 2.7x
; Qwen3-Coder-Next per token: 34,816 B/token at q8_0. Native 262144 is NOT
; reachable on this card and is deliberately absent below.
;
; 128k fits only at q4_0 KV *and* ubatch 256 (281 MiB free). Verified under a
; 127,116-token prompt without OOM, because the compute buffer is sized from
; ubatch at load and does not grow with prompt length. It leaves no room for a
; second GPU consumer — close Resolve before selecting it.
;
; reasoning-budget is required, not cosmetic. reasoning_effort defaults to
; 'xhigh' and on a hard prompt yields ZERO characters of content at max_tokens
; 1200. Setting reasoning_effort to 'low' does not fix it; capping the budget
; does.

[qwen3.8-32k]
model            = /home/nipuna/llama.cpp/models/Qwen3.8-27B-UD-Q3_K_XL.gguf
ctx-size         = 32768
ubatch-size      = 1024
batch-size       = 2048
flash-attn       = on
cache-type-k     = q8_0
cache-type-v     = q8_0
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
reasoning-budget = 1024

; q8_0 KV, not q4_0, despite the tighter fit — q4_0 costs up to 23% of
; generation at depth, which is exactly what this preset is for. ubatch 512
; buys back the compute buffer q8_0 needs.
[qwen3.8-64k]
model            = /home/nipuna/llama.cpp/models/Qwen3.8-27B-UD-Q3_K_XL.gguf
ctx-size         = 65536
ubatch-size      = 512
batch-size       = 2048
flash-attn       = on
cache-type-k     = q8_0
cache-type-v     = q8_0
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
reasoning-budget = 1024

[qwen3.8-128k]
model            = /home/nipuna/llama.cpp/models/Qwen3.8-27B-UD-Q3_K_XL.gguf
ctx-size         = 131072
ubatch-size      = 256
batch-size       = 2048
flash-attn       = on
cache-type-k     = q4_0
cache-type-v     = q4_0
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
reasoning-budget = 1024

; --------------------------------------------------- Nemotron-3-Nano-30B-A3B
; MoE 31.6B / 3.5B active, Mamba2 hybrid. 52 layers, only SIX keep KV (indices
; 5/12/19/26/33/42) at 2 heads x 128 = 3,264 B/token at q8_0. That is 3.3x
; cheaper than Qwen3.6 and 10.7x cheaper than Qwen3.8, and it is why this is the
; only model here whose 1M context is NATIVE — no YaRN, no rope scaling.
;
; 1M is limited by the compute buffer, not the cache: -ub 1024 wants 4,038 MiB
; and fails regardless of offload. ubatch 256 + q4_0 KV + n-cpu-moe 32 fits with
; 2,200 MiB free.
;
; Thinking model with the same trap as qwen3.8 — default reasoning returns zero
; content. reasoning-budget is required. Sampling is the GGUF's own
; general.sampling.* (temp 1.0, top_p 1.0).

[nemotron-32k]
model            = /home/nipuna/llama.cpp/models/Nemotron-3-Nano-30B-A3B-UD-Q4_K_XL.gguf
ctx-size         = 32768
n-cpu-moe        = 24
ubatch-size      = 1024
batch-size       = 2048
flash-attn       = on
cache-type-k     = q8_0
cache-type-v     = q8_0
temp             = 1.0
top-p            = 1.0
min-p            = 0.0
reasoning-budget = 1024

[nemotron-128k]
