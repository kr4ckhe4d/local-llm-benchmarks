title = "Service crashes at startup in staging"
kind = "debug"
protected = ["tests/test_loader.py"]
prompt = """
The service fails to start in staging but works locally. The crash log from the staging
container is in `logs/crash.log`, together with the environment it ran with.

Find the root cause in the `appcfg` package and fix it. Environment overrides
(`APP__SECTION__KEY=value`, double underscore as the separator, any depth) must work for
any path, including sections and keys that are not in the defaults or the config file;
those are created. Values keep the existing coercion rules: an override of a key that already
exists takes that key's type (int, float or bool), and new keys stay strings. Overrides
must not modify the module-level DEFAULTS.
"""
