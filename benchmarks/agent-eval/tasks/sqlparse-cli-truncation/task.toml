title = "sqlparse: CLI wipes the file when formatting fails"
kind = "real-bugfix"
upstream = "https://github.com/andialbrecht/sqlparse"
commit = "3512a9d86912720ae67181ad2e9fd9cc28a73408"
overlay = true
max_turns = 50
check = 'python -m pytest -q -p no:cacheprovider -o addopts="" tests/test_cli.py'
prompt = """
This is the source of `sqlparse`, a non-validating SQL parser and formatter for Python. Run
tests with `python -m pytest tests/<file>`.

Bug report:

> I ran `sqlformat --in-place --reindent big.sql` on a very large generated query. It crashed
> with a traceback (`SQLParseError`, the grouping limit) and `big.sql` is now EMPTY. The
> same happens with `-o out.sql`: the output file was truncated before anything was
> written.

Expected: if formatting fails, the CLI must not touch the target file: with `--in-place`
the input keeps its contents, and with `-o` an existing output file keeps its contents.
A formatting error (`SQLParseError`) is reported as a normal CLI error, not a traceback:
`main()` returns 1 and prints a message to stderr that starts with `[ERROR] Failed to format`.
Successful runs behave as before.
"""
