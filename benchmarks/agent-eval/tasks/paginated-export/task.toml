title = "Contact export silently drops records"
kind = "bugfix"
protected = ["tests/test_client.py"]
prompt = """
Customer ticket:

> We have 120 contacts in the CRM but the CSV export only has 100 rows. A colleague with 80
> contacts says hers is fine. No error is shown.

The export uses `ContactClient.fetch_all()` in `crm/client.py`, which pages through the API
(`GET /contacts?offset=&limit=`, response `{"total": int, "items": [...]}`). Fix it so
`fetch_all()` returns every contact, in API order, for any total (including 0 and exact
multiples of the page size). It must make exactly one request per page: no duplicate
requests and no requests for offsets at or past the end. Keep using the configured page size.
"""
