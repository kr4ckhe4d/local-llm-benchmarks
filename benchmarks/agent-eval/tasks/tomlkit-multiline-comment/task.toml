title = "tomlkit: multiline comment() produces invalid TOML"
kind = "real-bugfix"
upstream = "https://github.com/python-poetry/tomlkit"
commit = "d94175295a128b671858661e318e7040341acb10"
overlay = true
max_turns = 50
check = 'python -m pytest -q -p no:cacheprovider -o addopts="" tests/test_api.py'
prompt = """
This is the source of `tomlkit`, a style-preserving TOML library for Python. Run tests with
`python -m pytest tests/<file>` (the full suite is slow).

Bug report:

> `doc.add(tomlkit.comment("line one\\nline two"))` writes `# line one` and then a bare
> `line two` on the next line, so the file I save is not valid TOML any more.

Expected: `tomlkit.comment(text)` with a multi-line string renders every line as a comment:
each non-empty line as `# <line>` and each empty line as a lone `#`. For example
`comment("line one\\nline two\\n\\nline four")` added to an empty document renders as
`# line one\\n# line two\\n#\\n# line four\\n`, and the output parses back unchanged.
Single-line comments render as before (`# a comment`).
"""
