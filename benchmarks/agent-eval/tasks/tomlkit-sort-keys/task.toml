title = "tomlkit: dumps(sort_keys=True) ignored for parsed documents"
kind = "real-bugfix"
upstream = "https://github.com/python-poetry/tomlkit"
commit = "8e32f9cb7fcfbc45e893c34e0e9a590a26675fd6"
overlay = true
max_turns = 50
check = 'python -m pytest -q -p no:cacheprovider -o addopts="" tests/test_api.py'
prompt = """
This is the source of `tomlkit`, a style-preserving TOML library for Python. Run tests with
`python -m pytest tests/<file>` (the full suite is slow).

Bug report:

> `tomlkit.dumps(doc, sort_keys=True)` sorts keys when I pass a plain dict, but when I pass a
> document I got from `tomlkit.loads(...)` the output comes back in the original order.
> `dumps(loads('zzz = 1\\naaa = "foo"'), sort_keys=True)` gives `zzz = 1\\naaa = "foo"\\n`.

Expected: `sort_keys=True` sorts keys for parsed documents too (that example must give
`aaa = "foo"\\nzzz = 1\\n`). Without `sort_keys`, a parsed document must still be dumped
exactly as it was parsed, formatting and order preserved.
"""
