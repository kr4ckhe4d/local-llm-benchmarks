title = "Note search is injectable and breaks on quotes"
kind = "security"
protected = ["tests/test_search.py"]
prompt = """
Security review finding on the notes app:

> `search_notes` builds its SQL with string formatting. A search for `' OR '1'='1` returns every
> user's notes, and an ordinary search for `don't` raises `sqlite3.OperationalError`.

Fix `notes/db.py` so no user input is ever interpolated into SQL. Search behaviour must stay
the same for normal input: case-insensitive substring match on title or body, only the given
owner's notes, optional exact tag filter, newest first. In addition, the search term must be
matched literally: searching for `100%` or `a_b` must only find notes that contain that exact
text, not treat `%` and `_` as wildcards.
"""
