title = "Daily job drifts by an hour after daylight saving changes"
kind = "bugfix"
protected = ["tests/test_schedule.py"]
prompt = """
Ops report:

> Our "every day at 09:00 Sydney time" job ran at 10:00 local on Monday 6 April 2026, the day
> after daylight saving ended, and it kept running at 10:00 until we restarted the scheduler.
> The New York instance has the same problem in March. The preview of upcoming runs
> (`runs_between`) shows the same drift.

The scheduling code is in `cronlite/schedule.py`. Fix it so that a daily job always runs at its
configured local wall-clock time in its time zone, on every day, including across daylight
saving transitions in either direction. `next_daily_run` must keep returning a timezone-aware
datetime in the job's zone, the same day if that time is still ahead, otherwise the next day.
`runs_between(start, end, ...)` lists every run at or after `start` and strictly before `end`.
"""
