title = "tomlkit: deleting a key from an inline table leaves ', ,'"
kind = "real-bugfix"
upstream = "https://github.com/python-poetry/tomlkit"
commit = "207a2e869b05b4849240937a2c8b333b6422887b"
overlay = true
max_turns = 50
check = 'python -m pytest -q -p no:cacheprovider -o addopts="" tests/test_items.py '
prompt = """
This is the source of `tomlkit`, a style-preserving TOML library for Python. Run tests with
`python -m pytest tests/<file>` (the full suite is slow).

Bug report:

> `doc = tomlkit.parse("a = {foo = 1, bar = 2, baz = 3}\\n")`, then `del doc["a"]["bar"]`,
> then `doc.as_string()` gives `a = {foo = 1, , baz = 3}`, which is invalid TOML.

Expected: removing any element of an inline table, including one in the middle, leaves a
valid inline table without a doubled or dangling separator; the rendered document parses
back to the remaining keys and values and re-renders identically.
"""
