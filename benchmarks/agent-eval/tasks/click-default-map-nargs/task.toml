title = "click: default_map string not split for nargs=2 options"
kind = "real-bugfix"
upstream = "https://github.com/pallets/click"
commit = "8bd8b4a074c55c03b6eb5666edc44a9c43df38a2"
overlay = true
max_turns = 50
check = 'PYTHONPATH=src python -m pytest -q -p no:cacheprovider -o addopts="" tests/test_defaults.py'
prompt = """
This is the source of the `click` library (Python CLI toolkit). The full test suite is
slow; run the relevant test files, e.g. `PYTHONPATH=src python -m pytest tests/test_utils.py`.

Bug report:

> I load defaults from a config file into `default_map`. For `@click.option("--point",
> nargs=2, type=int)` the config has `point = "3 4"`, and the command fails with a
> conversion error. Setting the same option through its environment variable
> (`POINT="3 4"`) works fine.

Expected: a plain string coming from `default_map` for a parameter that takes multiple values
(`nargs` other than 1, including tuple types like `type=(str, str)`) is split exactly the way
the same string from an environment variable is split. Values in `default_map` that are
already tuples or lists are used as they are, and values given on the command line still win
over `default_map`.
"""
