title = "sqlparse: get_real_name() wrong for db.schema.table.column"
kind = "real-bugfix"
upstream = "https://github.com/andialbrecht/sqlparse"
commit = "df8e28495a87954a9d52de70c33ef7225c53b28f"
overlay = true
max_turns = 50
check = 'python -m pytest -q -p no:cacheprovider -o addopts="" tests/test_parse.py'
prompt = """
This is the source of `sqlparse`, a non-validating SQL parser and formatter for Python. Run
tests with `python -m pytest tests/<file>`.

Bug report:

> For `sqlparse.parse("db.schema.tbl.col")[0].tokens[0]`, `get_real_name()` returns
> `schema` instead of `col`. Two-part names like `a.b` are fine.

Expected: for a dotted identifier the real name is the part after the last dot, for any
number of parts, so `get_real_name()` and `get_name()` give `col` above, and `x.y.z AS w`
has real name `z` and alias `w`. `get_parent_name()` keeps returning the first part
(`db`). Two-part names and qualified function calls (`mydb.sch.func(1)` has real name
`func`) must keep working.
"""
