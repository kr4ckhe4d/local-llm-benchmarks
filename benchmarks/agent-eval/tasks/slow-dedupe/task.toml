title = "Nightly ETL job takes 40 minutes in dedupe"
kind = "performance"
protected = ["tests/test_dedupe.py"]
prompt = """
The nightly import has grown to ~200,000 records and now spends most of its 40 minutes inside
`etl.dedupe.dedupe`. Profiling points straight at it.

Make `dedupe` fast enough that 200,000 records take well under a few seconds, without changing
what it returns: it keeps the first occurrence of each key, preserves input order, and the
default key is the whole record. Records are JSON-like dicts (values can be nested dicts and
lists), and a custom `key` function may also return unhashable values such as lists or dicts.
Two keys are duplicates exactly when they are equal (`==`), as today.
"""
