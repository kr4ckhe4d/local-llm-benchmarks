title = "Python-Markdown: code spans with unequal backtick runs"
kind = "real-bugfix"
upstream = "https://github.com/Python-Markdown/markdown"
commit = "3d70cfccdc0b54c0783edd5e7d168c5d8bfc0b1e"
overlay = true
max_turns = 50
check = 'python -m pytest -q -p no:cacheprovider -o addopts="" tests/test_syntax/inline/test_code.py '
prompt = '''
This is the source of Python-Markdown. Run tests with `python -m pytest tests/<path>` (the
inline code tests are under `tests/test_syntax/inline/`).

Bug report:

> Inline code with backtick runs of different lengths renders wrongly. For the input
> a ``` b ````` c
> no closing run matches the opening one, so there should be no code span, but there is.

Expected output for the two cases in the report:

* Input: a ``` b ````` c
  Output: <p>a ``` b ````` c</p>
  (no code span; the backticks stay literal and are not parsed again)
* Input: a ``` b `` c
  Output: <p>a <code>` b</code> c</p>
  (when the closing run is shorter than the opening run, the code span uses the closing
  run's length and the extra opening backticks become part of the code text)

All other code-span rendering must stay as it is.
'''
