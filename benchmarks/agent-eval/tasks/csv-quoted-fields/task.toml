title = "Bank CSV import breaks on quoted fields"
kind = "bugfix"
protected = ["tests/test_importer.py"]
prompt = """
Bug report from a user:

> Importing my bank export crashes or produces garbage. It works for most months, but this
> one has a merchant called "ACME, Inc." and a memo with a quote in it. Here are two rows
> from the file (header included):
>
>     Date,Description,Amount,Memo
>     2026-03-02,"ACME, Inc.",-42.50,"Invoice ""Q1"" settlement"
>     2026-03-03,Coffee,-4.20,
>     2026-03-04,Car service,"-1,250.00",
>
> `ledger import march.csv` fails with "could not convert string to float".

The importer is in `ledger/importer.py`. Fix it so that standard CSV exports import correctly,
including quoted fields that contain commas, escaped quotes ("") and line breaks, and quoted
amounts with a thousands separator like the car service row. Existing
behaviour (header handling, amount parsing, skipping blank lines) must keep working.
"""
