title = "click: 'Try --help' hint suggests an option the command doesn't accept"
kind = "real-bugfix"
upstream = "https://github.com/pallets/click"
commit = "f1f191ecd2c790b161187c78e7c88440e9524e5c"
overlay = true
max_turns = 50
check = 'PYTHONPATH=src python -m pytest -q -p no:cacheprovider -o addopts="" tests/test_formatting.py'
prompt = """
This is the source of the `click` library (Python CLI toolkit). The full test suite is
slow; run the relevant test files, e.g. `PYTHONPATH=src python -m pytest tests/test_utils.py`.

Bug report:

> My group uses `context_settings={"help_option_names": ["-h", "--help"]}`. One subcommand
> has its own `--host, -h` option. When that subcommand is called without its required
> argument, the error says `Try 'cli foo -h' for help.`, but `-h` there means `--host`, so
> following the hint doesn't show help.

Expected behaviour of the hint line in usage errors: only suggest a help option name that
actually works for that command (one not taken over by the command's own options), and
when several work, suggest the longest one (`--help` rather than `-h`). If none of the
help option names works for the command, there is no hint line at all. Everything else about
usage errors stays as it is.
"""
