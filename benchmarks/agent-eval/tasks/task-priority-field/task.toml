title = "Add a priority field to tasks"
kind = "feature"
protected = ["tests/test_api.py"]
prompt = """
Product wants task priorities in the todo service. Add a `priority` field to tasks, end to end:

* Allowed values are "low", "normal" and "high"; the default is "normal".
* `create_task` accepts an optional "priority" in its payload. An unknown value raises
  `ValueError` and nothing is saved.
* `update_task(store, task_id, payload)` (it already exists) can change the priority, with
  the same validation.
* Priority is saved to and loaded from the JSON store. Stores written before this change
  (tasks without a priority) must still load, with those tasks treated as "normal".
* `list_tasks(store, priority=None, sort=None)`: `priority=` filters to one level, and
  `sort="priority"` orders high, then normal, then low, keeping id order within a level.
  Without `sort` the order stays as it is today (by id).
* Every task dict returned by the API includes "priority".
"""
