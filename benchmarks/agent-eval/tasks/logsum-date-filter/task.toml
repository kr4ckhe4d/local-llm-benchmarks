title = "Add --since/--until date filters to the log summariser"
kind = "feature"
protected = ["tests/test_cli.py"]
prompt = """
Feature request:

> When I'm investigating an incident I only care about one or two days of the access log, but
> `python -m logsum access.log` always summarises the whole file. Please add date filters.

Add two optional flags to the `logsum` CLI:

* `--since YYYY-MM-DD`: only count requests on or after that date.
* `--until YYYY-MM-DD`: only count requests on or before that date (the whole day included).

The date of a request is the calendar date written in its log timestamp (e.g.
`[21/Nov/2026:23:59:59 +0800]` is 21 Nov 2026), whatever its UTC offset. Both flags can be
combined. A malformed date must print an error containing `invalid date` to stderr and exit with
status 2. The output format and everything else about the CLI must stay as it is now.
"""
