title = "Route distances come back in the wrong units"
kind = "bugfix"
protected = ["tests/test_routes.py"]
prompt = """
Two bug reports, probably related:

> 1. The dashboard shows the Perth-Sydney distance as 3290 "mi". That's the km figure. It only
>    happens after someone has looked at the same route in km first.
> 2. Planning a route with waypoints (`route_length([...])`) crashes with
>    `TypeError: unhashable type: 'list'`.

Both go through the `@memoize` decorator in `geo/cache.py`. Fix the decorator so a cached
result is only reused for a call with the same arguments: positional and keyword arguments both
count, and keyword order does not matter. Calls with arguments that cannot be hashed must
still work; they are simply not cached. Repeated identical calls must still hit the cache.
Keep `cache_info()` and `cache_clear()` working.
"""
