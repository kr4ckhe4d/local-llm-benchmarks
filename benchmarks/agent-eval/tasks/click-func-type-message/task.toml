title = "click: custom type's ValueError message is thrown away"
kind = "real-bugfix"
upstream = "https://github.com/pallets/click"
commit = "5b9630f50fde938b72ad8c99542efe3a6f5717e2"
overlay = true
max_turns = 50
check = 'PYTHONPATH=src python -m pytest -q -p no:cacheprovider -o addopts="" tests/test_types.py'
prompt = """
This is the source of the `click` library (Python CLI toolkit). The full test suite is
slow; run the relevant test files, e.g. `PYTHONPATH=src python -m pytest tests/test_utils.py`.

Bug report:

> I pass a plain function as an option type (`type=parse_port`). It raises
> `ValueError("port must be between 1 and 65535")`, but the user only sees
> `Invalid value for '--port': 70000`. The helpful message is lost.

Expected: when a function used as a parameter type raises `ValueError` with a message, the
resulting `BadParameter` error uses that message. If the `ValueError` has no message, keep
today's behaviour of reporting the offending value (decoding bytes as UTF-8 with
replacement if the value can't be converted to text).
"""
