title = "click: usage line is blank for a command with no arguments"
kind = "real-bugfix"
upstream = "https://github.com/pallets/click"
commit = "7c99ebe23b931f27562d926814423cce85fd9766"
overlay = true
max_turns = 50
check = 'PYTHONPATH=src python -m pytest -q -p no:cacheprovider -o addopts="" tests/test_formatting.py'
prompt = """
This is the source of the `click` library (Python CLI toolkit). The full test suite is
slow; run the relevant test files, e.g. `PYTHONPATH=src python -m pytest tests/test_utils.py`.

Bug report:

> `HelpFormatter.write_usage(prog, args="")` produces a broken usage line. With the default
> prefix I get an empty line instead of `Usage: Program`, and in some widths there's an extra
> line with stray characters. It happens for any command that has no parameters to show in
> its usage (e.g. a command with `options_metavar=""` and no params).

Expected: with empty `args`, `write_usage` writes exactly one line, the prefix followed by the
program name with no trailing space, e.g. `Usage: Program\n`, or `Run: Program\n` with
`prefix="Run: "`. The formatter's current indentation and narrow widths must not change that:
even when the program name is too long to share a line with arguments, nothing is written
after that single line. With non-empty `args` the output must stay exactly as it is today.
"""
